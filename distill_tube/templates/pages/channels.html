{% extends 'base.html' %}

{% block content %}

<div 
  class="flex items-center gap-6 mb-8 p-6 pointer-box justify-between"
>
  <div class="flex items-center gap-6">
    <span class="text-lg uppercase tracking-wide pointer-text">
      Intention:
    </span>
    
    <div class="flex flex-wrap gap-2">
      {% for cat in current_cats %}
        <span 
          data-tag="{{ cat }}" 
          class="tag-pill shadow-sm"
        >
          {{ cat }}
        </span>
      {% endfor %}
    </div>
  </div>
  
  <a 
    href="/?change_focus=1&next={{ page }}" 
    class="nav-link ml-auto text-base font-bold text-gray-500"
  >
    Change Your Mind
  </a>
</div>

<div 
  id="video-grid-container" 
  class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"
>

  <div 
    onclick="openAddChannelModal()" 
    class="add-channel-card relative bg-white dark:bg-black shadow-sm p-6 flex flex-col justify-center items-center hover:shadow-md h-full min-h-[200px]"
  >
    <h3 class="text-2xl font-extrabold add-channel-text">Add Channel</h3>
  </div>

  {% for channel in channels %}
    {% include 'components/channel_card.html' %}
  {% endfor %}

</div>
{% endblock %}
